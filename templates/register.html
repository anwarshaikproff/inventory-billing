{% extends "base.html" %}

{% block title %}Register Admin - SKML Mobiles POS & Inventory{% endblock %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh; padding: 2rem 0;">
    <div class="row w-100 justify-content-center">
        <div class="col-md-6">
            <!-- Glassmorphic Register Card -->
            <div class="glass-card shadow-lg p-5">
                <div class="text-center mb-4">
                    <div class="mb-3">
                        <i class="fas fa-user-shield text-primary" style="font-size: 48px; background: linear-gradient(135deg, #6366f1, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent;"></i>
                    </div>
                    <h2 class="fw-bold tracking-tight mb-1">Admin Registration</h2>
                    <p class="text-secondary small">Create a new Admin account for SKML Mobiles</p>
                </div>

                <form action="{{ url_for('auth.register') }}" method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="full_name" class="form-label fw-semibold">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-end-0 border-color"><i class="fas fa-id-card text-secondary"></i></span>
                                <input type="text" class="form-control border-start-0" id="full_name" name="full_name" placeholder="Full name" required>
                            </div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="username" class="form-label fw-semibold">Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-end-0 border-color"><i class="fas fa-user text-secondary"></i></span>
                                <input type="text" class="form-control border-start-0" id="username" name="username" placeholder="Username" required>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label fw-semibold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-end-0 border-color"><i class="fas fa-envelope text-secondary"></i></span>
                                <input type="email" class="form-control border-start-0" id="email" name="email" placeholder="Email" required>
                            </div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="phone" class="form-label fw-semibold">Phone Number</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-end-0 border-color"><i class="fas fa-phone text-secondary"></i></span>
                                <input type="text" class="form-control border-start-0" id="phone" name="phone" placeholder="Phone" required>
                            </div>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6 mb-3">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-end-0 border-color"><i class="fas fa-lock text-secondary"></i></span>
                                <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="Password" required>
                            </div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="confirm_password" class="form-label fw-semibold">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-end-0 border-color"><i class="fas fa-key text-secondary"></i></span>
                                <input type="password" class="form-control border-start-0" id="confirm_password" name="confirm_password" placeholder="Confirm" required>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-premium w-100 mb-3 py-2 fs-6">
                        <i class="fas fa-user-plus me-2"></i>Register Admin
                    </button>

                    <div class="text-center mt-3">
                        <p class="text-secondary small mb-0">Already have an admin account? <a href="{{ url_for('auth.login') }}" class="text-primary fw-semibold">Sign In</a></p>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
